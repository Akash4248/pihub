x-python-healthcheck: &python-healthcheck
  interval: 30s
  timeout: 5s
  retries: 3

services:
  qdrant:
    image: qdrant/qdrant:v1.13.4
    container_name: pihub-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    volumes:
      - qdrant_data:/qdrant/storage
      - backend_logs:/var/log/qdrant
    expose:
      - "6333"
      - "6334"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && echo qdrant-healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 1024m
    cpus: 1.0

  mongo:
    image: mongo:7.0
    container_name: pihub-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-pihub}
    volumes:
      - mongo_data:/data/db
      - backend_logs:/var/log/mongo
    expose:
      - "27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 512m
    cpus: 1.0

  cobalt:
    image: ghcr.io/imputnet/cobalt:latest
    container_name: pihub-cobalt
    restart: unless-stopped
    init: true
    environment:
      API_URL: ${COBALT_PUBLIC_URL:-http://cobalt:9000}
    expose:
      - "9000"
    profiles:
      - build

  searxng:
    image: searxng/searxng:latest
    container_name: pihub-searxng
    restart: unless-stopped
    # Build-time-only enrichment search backend. Replaces fragile DuckDuckGo HTML
    # scraping; the finder falls back to DDG if this is absent.
    environment:
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://searxng:8080/}
      SEARXNG_SETTINGS_USE_DEFAULT_SETTINGS: "true"
    volumes:
      - searxng_data:/etc/searxng
    expose:
      - "8080"
    profiles:
      - build

  inference-service:
    build:
      context: .
      dockerfile: inference-service/Dockerfile
      network: host
    container_name: pihub-inference-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CONTENT_PIPELINE_URL: ${CONTENT_PIPELINE_URL:-http://content-pipeline:8001}
      LLAMA_SERVER_HOST: ${LLAMA_SERVER_HOST:-127.0.0.1}
      LLAMA_SERVER_PORT: ${LLAMA_SERVER_PORT:-8081}
      LLAMA_MODEL_PATH: ${LLAMA_MODEL_PATH:-/models/model.gguf}
      LLAMA_CONTEXT_SIZE: ${LLAMA_CONTEXT_SIZE:-2048}
      LLAMA_MAX_TOKENS: ${LLAMA_MAX_TOKENS:-256}
      LLAMA_TEMPERATURE: ${LLAMA_TEMPERATURE:-0.4}
      LLAMA_TOP_P: ${LLAMA_TOP_P:-0.9}
      LLAMA_PROMPT_CACHE_SIZE: ${LLAMA_PROMPT_CACHE_SIZE:-128}
      CONTENT_GENERATION_BACKEND: ${CONTENT_GENERATION_BACKEND:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      GEMMA_CONTENT_MODEL: ${GEMMA_CONTENT_MODEL:-gemma4}
      CONTENT_GENERATION_TEMPERATURE: ${CONTENT_GENERATION_TEMPERATURE:-0.2}
      CONTENT_GENERATION_TOP_P: ${CONTENT_GENERATION_TOP_P:-0.9}
      CONTENT_GENERATION_RETRIES: ${CONTENT_GENERATION_RETRIES:-3}
    depends_on:
      - content-pipeline
    volumes:
      - shared_storage:/shared
      - backend_logs:/logs
      - ./inference-service/models:/models
    expose:
      - "8010"
    healthcheck:
      <<: *python-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/ai/health', timeout=2).read()"]
      start_period: 30s
    mem_limit: 4096m
    cpus: 2.0

  pihub:
    build:
      context: .
      dockerfile: pihub/Dockerfile
      network: host
    container_name: pihub-node
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PIHUB_DB_PATH: ${PIHUB_DB_PATH:-/storage/pihub.sqlite3}
      PIHUB_ADMIN_TOKEN: ${PIHUB_ADMIN_TOKEN:-change-me}
      PIHUB_DEVICE_TOKEN_SECRET: ${PIHUB_DEVICE_TOKEN_SECRET:-change-me-too}
      PIHUB_CLASSROOM_NAME: ${PIHUB_CLASSROOM_NAME:-Classroom A}
    volumes:
      - ./pihub/packs:/packs
      - ./pihub/storage:/storage
      - ./pihub/cache:/cache
      - ./pihub/logs:/logs
    expose:
      - "8020"
    healthcheck:
      <<: *python-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8020/health', timeout=2).read()"]
      start_period: 30s
    mem_limit: 1024m
    cpus: 1.0

  content-pipeline:
    build:
      context: .
      dockerfile: content-pipeline/Dockerfile
      network: host
    container_name: pihub-content-pipeline
    restart: unless-stopped
    env_file:
      - .env
    environment:
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-educational_chunks}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-BAAI/bge-small-en-v1.5}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
      EMBEDDING_CACHE_DIR: ${EMBEDDING_CACHE_DIR:-/shared/models/sentence-transformers/embedding}
      LOCAL_RETRIEVAL_MODEL_NAME: ${LOCAL_RETRIEVAL_MODEL_NAME:-BAAI/bge-small-en-v1.5}
      LOCAL_RETRIEVAL_DEVICE: ${LOCAL_RETRIEVAL_DEVICE:-cpu}
      LOCAL_RETRIEVAL_CACHE_DIR: ${LOCAL_RETRIEVAL_CACHE_DIR:-/shared/models/sentence-transformers/retrieval}
      UPLOAD_DIR: ${UPLOAD_DIR:-/shared/uploads}
      WORK_DIR: ${WORK_DIR:-/shared/work}
      MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017}
      MONGO_DB: ${MONGO_DB:-pihub}
      MEDIA_STORAGE_PATH: ${MEDIA_STORAGE_PATH:-/shared/media}
      ENRICHMENT_LANGUAGES: ${ENRICHMENT_LANGUAGES:-en,kn}
      ENRICHMENT_COLLECTION: ${ENRICHMENT_COLLECTION:-enrichment_resources}
      COBALT_API_URL: ${COBALT_API_URL:-http://cobalt:9000}
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
    depends_on:
      qdrant:
        condition: service_healthy
      mongo:
        condition: service_healthy
    volumes:
      - shared_storage:/shared
      - ../generated_pack:/shared/generated_pack:ro
      - backend_logs:/logs
    expose:
      - "8001"
    healthcheck:
      <<: *python-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2).read()"]
      start_period: 60s
    mem_limit: 4096m
    cpus: 2.0

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
      network: host
    container_name: pihub-gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CONTENT_PIPELINE_URL: ${CONTENT_PIPELINE_URL:-http://content-pipeline:8001}
      INFERENCE_SERVICE_URL: ${INFERENCE_SERVICE_URL:-http://inference-service:8010}
      PIHUB_URL: ${PIHUB_URL:-http://pihub:8020}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      PACK_SERVICE_URL: ${PACK_SERVICE_URL:-http://pack-service:8030}
      EXPERIMENT_SERVICE_URL: ${EXPERIMENT_SERVICE_URL:-http://experiment-service:8040}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      - content-pipeline
      - inference-service
      - pihub
      - qdrant
      - pack-service
      - experiment-service
    volumes:
      - shared_storage:/shared
      - backend_logs:/logs
    expose:
      - "8000"
    healthcheck:
      <<: *python-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      start_period: 30s
    mem_limit: 1024m
    cpus: 1.0

  pack-service:
    build:
      context: .
      dockerfile: pack-service/Dockerfile
      network: host
    container_name: pihub-pack-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-educational_chunks}
      PACK_STORAGE_PATH: ${PACK_STORAGE_PATH:-/shared/packs}
      CURRICULUM_GRAPH_PATH: ${CURRICULUM_GRAPH_PATH:-/shared/work/curriculum_graph.json}
      PDF_LIBRARY_PATH: ${PDF_LIBRARY_PATH:-/shared/textbooks}
      PDF_MANIFEST_PATH: ${PDF_MANIFEST_PATH:-/shared/packs/pdf_manifests/pdf_manifest.json}
      INFERENCE_SERVICE_URL: ${INFERENCE_SERVICE_URL:-http://inference-service:8010}
      ENABLE_GEMMA_CONTENT_GENERATION: ${ENABLE_GEMMA_CONTENT_GENERATION:-true}
      CONTENT_GENERATION_TIMEOUT_SECONDS: ${CONTENT_GENERATION_TIMEOUT_SECONDS:-20}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      - qdrant
    volumes:
      - shared_storage:/shared
      - ../generated_pack:/shared/generated_pack:ro
      - ../TEXTBOOKS:/shared/textbooks:ro
      - ../phet_downloads:/shared/phet_downloads:ro
      - backend_logs:/logs
    expose:
      - "8030"
    healthcheck:
      <<: *python-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8030/health', timeout=2).read()"]
      start_period: 30s
    mem_limit: 2048m
    cpus: 2.0

  experiment-service:
    build:
      context: .
      dockerfile: experiment-service/Dockerfile
      network: host
    container_name: pihub-experiment-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - shared_storage:/shared
      - backend_logs:/logs
      - ../phet_downloads:/shared/simulations:ro
    expose:
      - "8040"
    healthcheck:
      <<: *python-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8040/health', timeout=2).read()"]
      start_period: 30s
    mem_limit: 1024m
    cpus: 1.0

  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: pihub-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    expose:
      - "9000"
      - "9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  db:
    image: postgres:16-alpine
    container_name: pihub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pihub}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pihub}"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    container_name: pihub-nginx
    restart: unless-stopped
    depends_on:
      - gateway
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - backend_logs:/var/log/nginx
    ports:
      - "${NGINX_PORT:-80}:80"

volumes:
  qdrant_data:
  mongo_data:
  minio_data:
  postgres_data:
  backend_logs:
  shared_storage:
  searxng_data:
